<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pro Dog Tag Creator</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f0f2f5;
            color: #1c1e21;
            text-align: center;
            padding: 20px;
            margin: 0;
            overscroll-behavior-y: contain; 
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
            background: white;
            padding: 30px 20px;
            border-radius: 16px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.15);
        }
        h1 { color: #355e93; font-size: 1.6em; margin-bottom: 10px; }
        
        .instructions {
            background-color: #f8fafc;
            border-left: 5px solid #355e93;
            padding: 15px;
            border-radius: 4px;
            margin-bottom: 20px;
            text-align: left;
            font-size: 0.85em;
            line-height: 1.4;
        }

        /* BLEED CONTAINER (230px x 430px) */
        .dog-tag-container {
            width: 230px; 
            height: 430px;
            border-radius: 115px; 
            border: 4px solid #bdc3c7;
            margin: 20px auto;
            position: relative;
            overflow: hidden;
            background-color: #ffffff;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
            display: flex;
            align-items: center;
            justify-content: center;
            touch-action: none; 
        }
        
        .dog-tag-container::before {
            content: '';
            position: absolute;
            top: 32px;
            left: 50%;
            transform: translateX(-50%);
            width: 20px;
            height: 20px;
            background-color: #f0f2f5; 
            border-radius: 50%;
            border: 2px solid #bdc3c7;
            z-index: 20;
            pointer-events: none; 
        }

        /* Safe Zone */
        .dog-tag-container::after {
            content: '';
            position: absolute;
            top: 20px; bottom: 20px; left: 20px; right: 20px;
            border: 2px dashed rgba(255, 255, 255, 0.7);
            border-radius: 95px;
            pointer-events: none;
            z-index: 15;
            display: none; 
        }
        .dog-tag-container.active::after { display: block; }

        #bg-image-preview {
            position: absolute;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: 1;
            display: none;
        }

        #photo-preview {
            position: absolute;
            display: none;
            z-index: 5;
            transform-origin: top left;
        }
        
        .drag-cursor { cursor: grab; }
        .drag-cursor:active { cursor: grabbing; }

        .control-section {
            margin: 15px 0;
            padding: 15px;
            background: #f9f9f9;
            border-radius: 10px;
            border: 1px solid #ddd;
        }

        .bg-colors {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 10px;
        }
